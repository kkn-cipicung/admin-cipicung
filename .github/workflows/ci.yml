name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript & Svelte check
        run: npm run check

      - name: Build project
        run: npm run build

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing secret: VPS_HOST" && exit 1)
          test -n "$VPS_USERNAME" || (echo "Missing secret: VPS_USERNAME" && exit 1)
          test -n "$VPS_PRIVATE_KEY" || (echo "Missing secret: VPS_PRIVATE_KEY" && exit 1)

          if [ -z "$VPS_PORT" ]; then
            echo "Using default SSH port 22"
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm install 24
              nvm use 24
            else
              echo "NVM is not installed. Using system Node version..."
            fi

            echo "Using Node.js:"
            node --version
            npm --version

            cd /home/ilham/app/admin-cipicung

            echo "Current directory:"
            pwd

            echo "Pull latest changes..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building project..."
            npm run build

            echo "Restarting PM2..."
            pm2 delete admin-cipicung || npx pm2 delete admin-cipicung || true
            PORT=3020 pm2 start build/index.js --name "admin-cipicung" || PORT=3020 npx pm2 start build/index.js --name "admin-cipicung"

            echo "Deployment finished successfully."
